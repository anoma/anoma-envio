name: anoma-envio
save_full_history: false
contracts:
  - name: ProtocolAdapter
    handler: src/EventHandlers.ts
    events:
      - event: ActionExecuted(bytes32 actionTreeRoot, bytes32[] nullifiers, bytes32[] consumedLogicRefs, bytes32[] commitments, bytes32[] createdLogicRefs)
      - event: ApplicationPayload(bytes32 indexed tag, uint256 index, bytes blob)
      - event: CommitmentTreeRootAdded(bytes32 root)
      - event: DiscoveryPayload(bytes32 indexed tag, uint256 index, bytes blob)
      - event: ExternalPayload(bytes32 indexed tag, uint256 index, bytes blob)
      - event: ForwarderCallExecuted(address indexed untrustedForwarder, bytes input, bytes output)
      - event: KindTableCommitmentUpdated(bytes32 indexed kindTableCommitment)
      - event: OwnershipTransferred(address indexed previousOwner, address indexed newOwner)
      - event: Paused(address account)
      - event: ResourcePayload(bytes32 indexed tag, uint256 index, bytes blob)
      - event: TransactionExecuted(bytes32 indexed transactionId)
      - event: Unpaused(address account)
      - event: Upgraded(address indexed implementation)
field_selection:
  transaction_fields:
    - "hash"
    - "from"
    - "to"
    - "value"
    - "input"
# Production indexing scope: Mainnet + Arbitrum + BSC + Monad + Stable + MegaETH + Aurora.
# Other chains (Base, Optimism, Base Sepolia, eth-sepolia) are
# excluded here to keep request volume within Envio's Free tier (500 rpm).
# Dev (config.yaml) continues to index the full chain set.
# The events above are the pa-evm v2 shapes; the addresses below are still the v1.1.0 deployments,
# which do not emit them. Repoint each chain (address + start_block) once v2 is deployed.
# Addresses from: https://github.com/anoma/pa-evm/blob/contracts/v1.1.0/bindings/src/addresses.rs
chains:
  - id: 1 # Mainnet
    start_block: 24326330
    contracts:
      - name: ProtocolAdapter
        address:
          - "0x0eA3B55b68A3f307c8FE3fe66E443247c95F0CfF"
  - id: 42161 # Arbitrum
    start_block: 425772682
    contracts:
      - name: ProtocolAdapter
        address:
          - "0x094FCC095323080e71a037b2B1e3519c07dd84F8"
  - id: 56 # BSC
    start_block: 84845926
    contracts:
      - name: ProtocolAdapter
        address:
          - "0xFC44b66a39fe6923Ad8d3c93bFeC369728862B68"
  - id: 143 # Monad
    start_block: 77753171
    contracts:
      - name: ProtocolAdapter
        address:
          - "0x2D2Fa19aFdbb20DC73737ca5f075cfAE00Cd90C2"
  - id: 988 # Stable
    start_block: 29105471
    # Stable is not supported by HyperSync, so index via RPC.
    rpc:
      url: https://rpc.stable.xyz
    contracts:
      - name: ProtocolAdapter
        address:
          - "0x2D2Fa19aFdbb20DC73737ca5f075cfAE00Cd90C2"
  - id: 4326 # MegaETH
    start_block: 19402510
    # V3 auto-resolve: explicit hypersync_config removed; V3 + ENVIO_API_TOKEN resolves this endpoint.
    # If V3 cannot auto-resolve, re-add: hypersync: { url: "https://4326.hypersync.xyz" }
    contracts:
      - name: ProtocolAdapter
        address:
          - "0x2D2Fa19aFdbb20DC73737ca5f075cfAE00Cd90C2"
  - id: 1313161554 # Aurora
    start_block: 203917905
    # V3 auto-resolve: explicit hypersync_config removed; V3 + ENVIO_API_TOKEN resolves this endpoint.
    # If V3 cannot auto-resolve, re-add: hypersync: { url: "https://1313161554.hypersync.xyz" }
    contracts:
      - name: ProtocolAdapter
        address:
          - "0x2D2Fa19aFdbb20DC73737ca5f075cfAE00Cd90C2"
