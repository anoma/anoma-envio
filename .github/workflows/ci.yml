name: CI

on:
  push:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # Generate matrix from config.yaml — single source of truth for chain list
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate matrix from config.yaml
        id: matrix
        run: |
          chmod +x scripts/generate-ci-matrix.sh
          MATRIX=$(./scripts/generate-ci-matrix.sh)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX" | python3 -m json.tool

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .claude/skills/ is extracted from the pinned envio CLI, so bumping envio
      # without re-running this leaves the skills describing the old API.
      # Extraction is byte-deterministic, so any diff here is real drift.
      - name: Skills match the pinned CLI
        run: |
          pnpm envio skills update
          git add -fAN .claude/skills/
          git diff --exit-code .claude/skills/

      - name: Resolve config env vars and run Envio codegen
        run: |
          perl -pe 's/\$\{(\w+):-([^}]*)\}/defined $ENV{$1} ? $ENV{$1} : $2/ge' config.yaml > config.resolved.yaml && mv config.resolved.yaml config.yaml
          pnpm codegen

      - name: Check formatting
        run: pnpm prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Run ESLint
        run: pnpm eslint "src/**/*.ts" "test/**/*.ts"

      - name: Type check
        run: pnpm tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve config env vars and run Envio codegen
        run: |
          perl -pe 's/\$\{(\w+):-([^}]*)\}/defined $ENV{$1} ? $ENV{$1} : $2/ge' config.yaml > config.resolved.yaml && mv config.resolved.yaml config.yaml
          pnpm codegen

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve config env vars and run Envio codegen
        run: |
          perl -pe 's/\$\{(\w+):-([^}]*)\}/defined $ENV{$1} ? $ENV{$1} : $2/ge' config.yaml > config.resolved.yaml && mv config.resolved.yaml config.yaml
          pnpm codegen

      - name: Build
        run: pnpm build

  # Skipped for Dependabot, which gets no repository secrets, so this job would
  # fail on an empty ALCHEMY_API_KEY before running anything. github.actor is
  # whoever triggered the run, so pushing a commit to a Dependabot branch by hand
  # brings the full matrix back.
  validation:
    name: Validate (${{ matrix.name }})
    needs: [setup]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve config env vars and run Envio codegen
        run: |
          perl -pe 's/\$\{(\w+):-([^}]*)\}/defined $ENV{$1} ? $ENV{$1} : $2/ge' config.yaml > config.resolved.yaml && mv config.resolved.yaml config.yaml
          pnpm codegen

      - name: Run config validation
        run: |
          # Prefer Alchemy archive RPC (supports historical queries like eth_getCode at block N)
          if [ -n "${{ matrix.alchemy }}" ] && [ -n "$ALCHEMY_API_KEY" ]; then
            export "RPC_${{ matrix.rpc_key }}=https://${{ matrix.alchemy }}.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
          elif [ -n "${{ matrix.rpc_url }}" ]; then
            export "RPC_${{ matrix.rpc_key }}=${{ matrix.rpc_url }}"
          fi
          pnpm exec vitest run test/ci/config-validation.test.ts --testNamePattern '\(chain ${{ matrix.chain_id }}\)'

  # Skipped for Dependabot for the same reason as validation above. A bot bump of
  # viem or envio does want this, so finish those by hand: one human commit on the
  # branch flips github.actor and the matrix runs.
  integration:
    name: Integration (${{ matrix.name }})
    needs: [setup]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve config env vars and run Envio codegen
        run: |
          perl -pe 's/\$\{(\w+):-([^}]*)\}/defined $ENV{$1} ? $ENV{$1} : $2/ge' config.yaml > config.resolved.yaml && mv config.resolved.yaml config.yaml
          pnpm codegen

      - name: Configure for CI (${{ matrix.name }} only)
        run: |
          # Filter to single chain
          yq -i '.chains = [.chains[] | select(.id == ${{ matrix.chain_id }})]' config.yaml

          # Detect how this chain syncs historical data.
          CONFIG_RPC=$(yq '.chains[0].rpc.url // ""' config.yaml)
          HYPERSYNC=$(yq '.chains[0].hypersync.url // ""' config.yaml)

          # Pick an archive RPC for tip detection (and, for RPC-sync chains, for
          # the indexer itself): prefer Alchemy, then the matrix public RPC, then
          # whatever rpc the config already declares.
          if [ -n "${{ matrix.alchemy }}" ] && [ -n "$ALCHEMY_API_KEY" ]; then
            RPC_URL="https://${{ matrix.alchemy }}.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
          elif [ -n "${{ matrix.rpc_url }}" ]; then
            RPC_URL="${{ matrix.rpc_url }}"
          else
            RPC_URL="$CONFIG_RPC"
          fi

          # If the chain syncs via neither rpc nor hypersync, inject
          # the RPC as its data source. Skip when hypersync is set — Envio
          # rejects defining both at once (EE106).
          if [ -z "$CONFIG_RPC" ] && [ -z "$HYPERSYNC" ]; then
            export RPC_URL
            yq -i '.chains[0].rpc.url = env(RPC_URL)' config.yaml
            # Remove transaction_fields not available via RPC (only via HyperSync)
            yq -i '.field_selection.transaction_fields -= ["gasUsed", "status"]' config.yaml
          fi

          # Get chain tip and set start_block near it for fast sync
          TIP_HEX=$(curl -sf "$RPC_URL" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
            | jq -r '.result')
          TIP=$((TIP_HEX))
          if [ "$TIP" -gt 5000 ]; then
            RECENT_START=$((TIP - 5000))
            export RECENT_START
            echo "Chain tip: $TIP, setting start_block to $RECENT_START"
            yq -i '.chains[0].start_block = env(RECENT_START)' config.yaml
          else
            echo "WARNING: Could not get valid chain tip (got $TIP), keeping config start_block"
          fi

          cat config.yaml

      - name: Start indexer stack
        run: docker compose --profile build up -d

      - name: Wait for indexer to sync
        run: |
          echo "Polling Hasura for schema readiness..."
          for i in $(seq 1 30); do
            RESULT=$(curl -sf http://localhost:8080/v1/graphql \
              -H 'Content-Type: application/json' \
              -d '{"query":"{ Transaction(limit:1) { id } }"}' 2>/dev/null || echo '{}')
            if echo "$RESULT" | grep -q '"Transaction"'; then
              echo "Schema ready after $((i * 10))s"
              # Give the indexer a few more seconds to process events
              sleep 15
              exit 0
            fi
            echo "Attempt $i/30 — schema not ready, retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for schema (300s)"
          exit 1

      - name: Run integration tests
        run: |
          export ENVIO_GRAPHQL_URL=http://localhost:8080/v1/graphql
          # Set RPC env var for parity test. HyperSync chains have no rpc,
          # so fall back to the matrix RPC.
          RPC_URL=$(yq '.chains[0].rpc.url // ""' config.yaml)
          [ -z "$RPC_URL" ] && RPC_URL="${{ matrix.rpc_url }}"
          if [ -n "$RPC_URL" ]; then
            export "RPC_${{ matrix.rpc_key }}=$RPC_URL"
          fi
          pnpm exec vitest run test/graphql.test.ts test/parity.test.ts

      - name: Docker compose logs
        if: failure()
        run: docker compose --profile build logs

      - name: Teardown
        if: always()
        run: docker compose --profile build down
