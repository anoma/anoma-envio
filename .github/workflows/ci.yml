name: CI

on:
  push:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # Generate matrix from config.yaml — single source of truth for chain list
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate matrix from config.yaml
        id: matrix
        run: |
          chmod +x scripts/generate-ci-matrix.sh
          MATRIX=$(./scripts/generate-ci-matrix.sh)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Generated matrix:"
          echo "$MATRIX" | python3 -m json.tool

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Check formatting
        run: pnpm prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Run ESLint
        run: pnpm eslint "src/**/*.ts" "test/**/*.ts"

      - name: Type check
        run: pnpm tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Build
        run: pnpm build

  validation:
    name: Validate (${{ matrix.name }})
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Run config validation
        run: |
          # Prefer Alchemy archive RPC (supports historical queries like eth_getCode at block N)
          if [ -n "${{ matrix.alchemy }}" ] && [ -n "$ALCHEMY_API_KEY" ]; then
            export "RPC_${{ matrix.rpc_key }}=https://${{ matrix.alchemy }}.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
          elif [ -n "${{ matrix.rpc_url }}" ]; then
            export "RPC_${{ matrix.rpc_key }}=${{ matrix.rpc_url }}"
          fi
          pnpm ts-mocha --timeout 120000 --grep '\(chain ${{ matrix.chain_id }}\)' 'test/ci/config-validation.test.ts'

  integration:
    name: Integration (${{ matrix.name }})
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Configure for CI (${{ matrix.name }} only)
        run: |
          # Filter to single chain
          yq -i '.networks = [.networks[] | select(.id == ${{ matrix.chain_id }})]' config.yaml

          # Ensure rpc_config is set (HyperSync chains need it for CI docker-compose)
          CONFIG_RPC=$(yq '.networks[0].rpc_config.url // ""' config.yaml)
          if [ -z "$CONFIG_RPC" ]; then
            # Construct RPC URL: prefer Alchemy (archive-capable), fall back to matrix.rpc_url
            if [ -n "${{ matrix.alchemy }}" ] && [ -n "$ALCHEMY_API_KEY" ]; then
              CONFIG_RPC="https://${{ matrix.alchemy }}.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
            elif [ -n "${{ matrix.rpc_url }}" ]; then
              CONFIG_RPC="${{ matrix.rpc_url }}"
            fi
            export CONFIG_RPC
            yq -i '.networks[0].rpc_config.url = env(CONFIG_RPC)' config.yaml
            # Remove transaction_fields not available via RPC (only via HyperSync)
            yq -i '.field_selection.transaction_fields -= ["gasUsed", "status"]' config.yaml
          fi

          # Get chain tip and set start_block near it for fast sync
          RPC_URL=$(yq '.networks[0].rpc_config.url' config.yaml)
          TIP_HEX=$(curl -sf "$RPC_URL" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
            | jq -r '.result')
          TIP=$((TIP_HEX))
          RECENT_START=$((TIP - 5000))
          export RECENT_START
          echo "Chain tip: $TIP, setting start_block to $RECENT_START"
          yq -i '.networks[0].start_block = env(RECENT_START)' config.yaml

          cat config.yaml

      - name: Start indexer stack
        run: docker compose --profile build up -d

      - name: Wait for indexer to sync
        run: |
          echo "Polling Hasura for schema readiness..."
          for i in $(seq 1 30); do
            RESULT=$(curl -sf http://localhost:8080/v1/graphql \
              -H 'Content-Type: application/json' \
              -d '{"query":"{ Transaction(limit:1) { id } }"}' 2>/dev/null || echo '{}')
            if echo "$RESULT" | grep -q '"Transaction"'; then
              echo "Schema ready after $((i * 10))s"
              # Give the indexer a few more seconds to process events
              sleep 15
              exit 0
            fi
            echo "Attempt $i/30 — schema not ready, retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for schema (300s)"
          exit 1

      - name: Run integration tests
        run: |
          export ENVIO_GRAPHQL_URL=http://localhost:8080/v1/graphql
          # Set RPC env var for parity test
          RPC_URL=$(yq '.networks[0].rpc_config.url // ""' config.yaml)
          if [ -n "$RPC_URL" ]; then
            export "RPC_${{ matrix.rpc_key }}=$RPC_URL"
          fi
          pnpm ts-mocha --timeout 120000 'test/graphql.test.ts' 'test/parity.test.ts'

      - name: Docker compose logs
        if: failure()
        run: docker compose --profile build logs

      - name: Teardown
        if: always()
        run: docker compose --profile build down

  integration-all:
    name: Integration (all chains)
    needs: [integration]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Configure all chains for CI
        run: |
          chmod +x scripts/configure-ci-all-chains.sh
          ./scripts/configure-ci-all-chains.sh

      - name: Start indexer stack
        run: docker compose --profile build up -d

      - name: Wait for indexer to sync
        run: |
          echo "Polling Hasura for schema readiness..."
          for i in $(seq 1 60); do
            RESULT=$(curl -sf http://localhost:8080/v1/graphql \
              -H 'Content-Type: application/json' \
              -d '{"query":"{ Transaction(limit:1) { id } }"}' 2>/dev/null || echo '{}')
            if echo "$RESULT" | grep -q '"Transaction"'; then
              echo "Schema ready after $((i * 10))s"
              # Give the indexer more time to process events across all chains
              sleep 30
              exit 0
            fi
            echo "Attempt $i/60 — schema not ready, retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for schema (600s)"
          exit 1

      - name: Run integration tests
        run: |
          export ENVIO_GRAPHQL_URL=http://localhost:8080/v1/graphql
          pnpm ts-mocha --timeout 120000 'test/graphql.test.ts' 'test/parity.test.ts'

      - name: Docker compose logs
        if: failure()
        run: docker compose --profile build logs

      - name: Teardown
        if: always()
        run: docker compose --profile build down
