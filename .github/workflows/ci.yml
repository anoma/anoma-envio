name: CI

on:
  push:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Check formatting
        run: pnpm prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Run ESLint
        run: pnpm eslint "src/**/*.ts" "test/**/*.ts"

      - name: Type check
        run: pnpm tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Build
        run: pnpm build

  validation:
    name: Validate (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chain_id: 1,          name: Mainnet,       alchemy: eth-mainnet }
          - { chain_id: 42161,      name: Arbitrum,      alchemy: arb-mainnet }
          - { chain_id: 8453,       name: Base,          alchemy: base-mainnet }
          - { chain_id: 10,         name: Optimism,      alchemy: opt-mainnet }
          - { chain_id: 11155111,   name: Sepolia,       alchemy: eth-sepolia }
          - { chain_id: 84532,      name: Base-Sepolia,  alchemy: base-sepolia }
          - { chain_id: 56,         name: BNB }
          - { chain_id: 97,         name: BNB-Testnet }
          - { chain_id: 1313161554, name: Aurora }
          - { chain_id: 1313161555, name: Aurora-Testnet }

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Run config validation
        env:
          RPC_${{ matrix.chain_id }}: ${{ matrix.alchemy && format('https://{0}.g.alchemy.com/v2/{1}', matrix.alchemy, secrets.ALCHEMY_API_KEY) || '' }}
        run: pnpm ts-mocha --timeout 120000 --grep '\[${{ matrix.name }}\]' 'test/ci/config-validation.test.ts'

  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chain_id: 1,          name: Mainnet,       alchemy: eth-mainnet }
          - { chain_id: 42161,      name: Arbitrum,      alchemy: arb-mainnet }
          - { chain_id: 8453,       name: Base,          alchemy: base-mainnet }
          - { chain_id: 10,         name: Optimism,      alchemy: opt-mainnet }
          - { chain_id: 11155111,   name: Sepolia,       alchemy: eth-sepolia }
          - { chain_id: 84532,      name: Base-Sepolia,  alchemy: base-sepolia }
          - { chain_id: 56,         name: BNB }
          - { chain_id: 97,         name: BNB-Testnet }
          - { chain_id: 1313161554, name: Aurora }
          - { chain_id: 1313161555, name: Aurora-Testnet }

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Configure for CI (${{ matrix.name }} only)
        run: |
          # Filter to single chain
          yq -i '.networks = [.networks[] | select(.id == ${{ matrix.chain_id }})]' config.yaml

          # Set Alchemy RPC for supported chains
          if [ -n "${{ matrix.alchemy }}" ]; then
            RPC_URL="https://${{ matrix.alchemy }}.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
            export RPC_URL
            yq -i '.networks[0].rpc_config.url = env(RPC_URL)' config.yaml
          fi

          # Get chain tip and set start_block near it for fast sync
          RPC_URL=$(yq '.networks[0].rpc_config.url' config.yaml)
          TIP_HEX=$(curl -sf "$RPC_URL" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
            | jq -r '.result')
          TIP=$((TIP_HEX))
          RECENT_START=$((TIP - 5000))
          export RECENT_START
          echo "Chain tip: $TIP, setting start_block to $RECENT_START"
          yq -i '.networks[0].start_block = env(RECENT_START)' config.yaml

          cat config.yaml

      - name: Start indexer stack
        run: docker compose --profile build up -d

      - name: Wait for indexer to sync
        run: |
          echo "Polling Hasura for schema readiness..."
          for i in $(seq 1 30); do
            RESULT=$(curl -sf http://localhost:8080/v1/graphql \
              -H 'Content-Type: application/json' \
              -d '{"query":"{ Transaction(limit:1) { id } }"}' 2>/dev/null || echo '{}')
            if echo "$RESULT" | grep -q '"Transaction"'; then
              echo "Schema ready after $((i * 10))s"
              # Give the indexer a few more seconds to process events
              sleep 15
              exit 0
            fi
            echo "Attempt $i/30 — schema not ready, retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for schema (300s)"
          exit 1

      - name: Run integration tests
        env:
          ENVIO_GRAPHQL_URL: http://localhost:8080/v1/graphql
          RPC_URL_OVERRIDE: ${{ matrix.alchemy && format('https://{0}.g.alchemy.com/v2/{1}', matrix.alchemy, secrets.ALCHEMY_API_KEY) || '' }}
        run: |
          export "RPC_${{ matrix.chain_id }}=${RPC_URL_OVERRIDE:-$(yq '.networks[0].rpc_config.url' config.yaml)}"
          pnpm ts-mocha --timeout 120000 'test/graphql.test.ts' 'test/parity.test.ts'

      - name: Docker compose logs
        if: failure()
        run: docker compose --profile build logs

      - name: Teardown
        if: always()
        run: docker compose --profile build down
