name: Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - next
      - staging
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-docker
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  packages: write
  contents: read

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: ghcr.io
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute branch prefix
        id: prefix
        if: github.ref_type == 'branch'
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          case "$BRANCH" in
            staging) echo "value=stag" >> "$GITHUB_OUTPUT" ;;
            *)       echo "value=$BRANCH" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_URL }}/${{ env.REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.prefix.outputs.value }}-envio,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ steps.prefix.outputs.value }}-envio-{{sha}},enable=${{ github.ref_type == 'branch' }}
            type=ref,event=pr,suffix=-envio-{{sha}}
            type=ref,event=tag

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=envio
          cache-to: type=gha,mode=max,scope=envio
          platforms: linux/amd64,linux/arm64
