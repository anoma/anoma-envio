name: Parity Check

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: parity-check
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  parity:
    name: Indexer vs RPC
    runs-on: ubuntu-latest
    # Only run if ENVIO_GRAPHQL_URL secret is configured
    if: ${{ vars.ENVIO_GRAPHQL_URL != '' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Envio codegen
        run: pnpm codegen

      - name: Run parity check
        env:
          ENVIO_GRAPHQL_URL: ${{ vars.ENVIO_GRAPHQL_URL }}
        run: pnpm ts-mocha --timeout 120000 'test/parity.test.ts'
