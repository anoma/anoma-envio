# Anoma Protocol Adapter GraphQL Schema
# Entities follow Anoma specification from pa-evm/contracts/src/interfaces/IProtocolAdapter.sol

# ============================================
# Enums
# ============================================

# Blob deletion criterion from PA-EVM DeletionCriterion
enum DeletionCriterion {
  immediately # Blob should be deleted after processing (value: 0)
  never # Blob should be persisted permanently (value: 1)
}

# Payload category indicator
enum PayloadCategory {
  resource # ResourcePayload - resource blob data
  discovery # DiscoveryPayload - data with public keys for discovery
  externalCall # ExternalPayload - data for external/forwarder calls
  application # ApplicationPayload - application-specific data
}

# ============================================
# EVM Types
# ============================================

# EVMTransaction - The EVM transaction that carries Anoma transaction(s)
# This represents the blockchain carrier/wrapper, not the Anoma payload.
# One EVM transaction may carry multiple Anoma transactions (e.g., via multicall).
type EVMTransaction
  @index(fields: ["chainId", "blockNumber"])
  @index(fields: ["chainId", "timestamp"]) {
  id: ID! # Format: {chainId}_{txHash}
  txHash: String!
  blockNumber: BigInt! @index
  timestamp: BigInt! @index
  chainId: BigInt! @index

  # EVM transaction metadata
  from: String
  value: BigInt

  # Relationships
  transactions: [Transaction!]! @derivedFrom(field: "evmTransaction")
}

# ============================================
# Core Anoma Types
# ============================================

# Transaction - The Anoma transaction payload embedded in an EVM transaction
# Corresponds to: struct Transaction { Action[] actions; bytes deltaProof; bytes aggregationProof; }
type Transaction
  @index(fields: ["chainId", "blockNumber"])
  @index(fields: ["chainId", "blockNumber", "logIndex"])
  @index(fields: ["contractAddress", "chainId", "blockNumber", "logIndex"]) {
  id: ID! # Format: {chainId}_{txHash}_{logIndex}
  logIndex: Int! @index # EVM event log index of the TransactionExecuted event
  contractAddress: String! @index

  # Denormalized from EVMTransaction for efficient sorting/filtering
  # (eliminates cross-table JOIN for ORDER BY blockNumber/timestamp)
  blockNumber: BigInt! @index
  timestamp: BigInt! @index
  chainId: BigInt! @index

  # From TransactionExecuted event: the Keccak-256 hash of the concatenated action tree roots —
  # the message the delta proof signs, unique per transaction and known before submission.
  transactionId: String! @index

  # Proofs (from calldata decoding)
  deltaProof: String
  aggregationProof: String

  # Relationship to EVM carrier
  evmTransaction: EVMTransaction! @index

  # Relationships (note: tags is a convenience, canonical path is via actions/complianceUnits)
  actions: [Action!]! @derivedFrom(field: "transaction")
  tags: [Tag!]! @derivedFrom(field: "transaction")
}

# Action - Provides context separation between non-intersecting sets of resources.
# One action is one compliance unit constraining any number of consumed and created resources.
# Corresponds to: struct Action { Consumed[] consumed; Created[] created; Delta unitDelta; bytes32 actionTreeRoot; }
type Action @index(fields: ["chainId", "blockNumber"]) {
  id: ID!
  index: Int! # Position among the transaction's actions, in ActionExecuted arrival order
  logIndex: Int! @index # EVM log index of the ActionExecuted event
  actionTreeRoot: String! @index
  actionTagCount: Int! # consumedCount + createdCount
  consumedCount: Int!
  createdCount: Int!
  blockNumber: BigInt! @index
  chainId: BigInt! @index
  timestamp: BigInt! @index

  # The delta value of the action's compliance unit (secp256k1 point), as decimal uint256 strings
  unitDeltaX: String
  unitDeltaY: String

  # EVM-tx correlation key ({chainId}_{txHash}); TransactionExecuted relinks the
  # transaction's actions through it.
  evmTxId: String! @index

  # Relationships
  transaction: Transaction! @index
  resources: [Resource!]! @derivedFrom(field: "action")
}

# Resource - The public data of one resource consumed or created by an action.
# Corresponds to: struct Consumed { bytes32 nullifier; bytes32 logicRef; bytes32 commitmentTreeRoot; AppData appData; }
#            and: struct Created  { bytes32 commitment; bytes32 logicRef; AppData appData; }
type Resource @index(fields: ["chainId", "timestamp"]) {
  id: ID!
  index: Int! # Position in the action's canonical tag order (consumed first, then created)
  timestamp: BigInt! @index
  chainId: BigInt! @index

  tagHash: String! # Nullifier when consumed, commitment when created
  logicRef: String! @index # Reference to the verifying key of the resource logic
  isConsumed: Boolean!

  # The historical commitment tree root the resource's inclusion was proven against.
  # Consumed resources only — a created resource has no such root yet.
  commitmentTreeRoot: String

  # AppData payload counts. Null when the calldata could not be decoded — the tag, logicRef and
  # side come from the event, but the payload counts exist only in calldata.
  resourcePayloadCount: Int
  discoveryPayloadCount: Int
  externalPayloadCount: Int
  applicationPayloadCount: Int

  # Relationships
  action: Action! @index
  tag: Tag @index
}

# Tag - A reference to an Anoma resource identified by its tag hash (nullifier or commitment)
type Tag @index(fields: ["chainId", "blockNumber"]) @index(fields: ["chainId", "timestamp"]) {
  id: ID!
  tagHash: String! @index # Nullifier (if consumed) or commitment (if created)
  index: Int! # Position within one action (consumed nullifiers, then created commitments)
  # (actionLogIndex, index) orders a transaction's tags; index alone repeats across actions.
  actionLogIndex: Int @index
  isConsumed: Boolean! # true = nullifier (consumed), false = commitment (created)
  blockNumber: BigInt! @index
  timestamp: BigInt! @index
  chainId: BigInt! @index

  # Logic reference from ActionExecuted.consumedLogicRefs / .createdLogicRefs
  logicRef: String

  # Relationships
  transaction: Transaction! @index
  resource: Resource
  payloads: [Payload!]! @derivedFrom(field: "tag")
}

# ============================================
# Payload Types (from events)
# ============================================

# Unified Payload type for all payload events (Resource, Discovery, External, Application)
# Note: blockNumber, chainId, timestamp can be accessed via tag.transaction
type Payload {
  id: ID!
  category: PayloadCategory! @index # Discriminator for payload type
  tagHash: String!
  index: Int!
  blob: String!
  deletionCriterion: DeletionCriterion
  tag: Tag @index
}

# ============================================
# State Tracking Types
# ============================================

# CommitmentTreeRoot - Merkle tree root for resource commitments
type CommitmentTreeRoot
  @index(fields: ["blockNumber", "logIndex"])
  @index(fields: ["chainId", "blockNumber", "logIndex"]) {
  id: ID!
  root: String!
  blockNumber: BigInt! @index
  logIndex: Int! # EVM log index — tiebreaker for ordering within a block
  txHash: String!
  timestamp: BigInt! @index
  chainId: BigInt! @index
}

# ForwarderCall - Meta-transaction execution via untrusted forwarder
type ForwarderCall @index(fields: ["chainId", "blockNumber"]) {
  id: ID!
  untrustedForwarder: String!
  input: String!
  output: String!
  blockNumber: BigInt! @index
  txHash: String!
  timestamp: BigInt! @index
  chainId: BigInt! @index
}

# OwnershipTransferred - OZ Ownable ownership transfer event
type OwnershipTransferred {
  id: ID!
  previousOwner: String!
  newOwner: String!
  blockNumber: BigInt!
  txHash: String!
  timestamp: BigInt!
  chainId: BigInt!
}

# ProtocolAdapterPaused - OZ Pausable pause/unpause event
# A single entity covers both Paused and Unpaused events; paused=true means paused.
type ProtocolAdapterPaused {
  id: ID!
  account: String!
  paused: Boolean!
  blockNumber: BigInt!
  txHash: String!
  timestamp: BigInt!
  chainId: BigInt!
}

# KindTableCommitment - The commitment of the kind table transactions must be proven against.
# One row per KindTableCommitmentUpdated event; the initialize() call emits the empty-table
# commitment, so the latest row per chain is the table currently in force.
type KindTableCommitment @index(fields: ["chainId", "blockNumber"]) {
  id: ID!
  kindTableCommitment: String! @index
  blockNumber: BigInt! @index
  logIndex: Int! # EVM log index — tiebreaker for ordering within a block
  txHash: String!
  timestamp: BigInt! @index
  chainId: BigInt! @index
}

# ProtocolAdapterUpgraded - ERC-1967 implementation change behind a v2 proxy.
# The adapter address is fixed but the implementation behind it is not, and the implementation is
# what decides the event shapes emitted. One row per Upgraded event; the latest row at or before a
# block identifies the implementation in force there.
type ProtocolAdapterUpgraded {
  id: ID!
  implementation: String!
  blockNumber: BigInt!
  txHash: String!
  timestamp: BigInt!
  chainId: BigInt!
}

# ============================================
# Distinct Logic Tracking
# ============================================

# LogicRef - Tracks each distinct logic verifying key seen on-chain
# Used to compute the distinctLogics counter in Stats.
type LogicRef {
  id: ID! # The logicRef hex value (bytes32)
  firstSeenBlock: BigInt!
  firstSeenTimestamp: BigInt!
  firstSeenChainId: BigInt!
  firstSeenTxHash: String!
}

# ============================================
# Aggregate Statistics
# ============================================

# Stats - Global statistics singleton (id: "global")
# Counters are incremented by event handlers for accurate totals.
type Stats {
  id: ID! # Always "global" - singleton pattern
  transactions: BigInt!
  tags: BigInt!
  tagsConsumed: BigInt!
  tagsCreated: BigInt!
  actions: BigInt!
  resources: BigInt!
  commitmentRoots: BigInt!
  distinctLogics: BigInt!
  externalCalls: BigInt!
  forwarderCalls: BigInt!
  resourcePayloads: BigInt!
  discoveryPayloads: BigInt!
  applicationPayloads: BigInt!
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
}

# DailyStats - Per-day statistics for time-series charts (id: "YYYY-MM-DD")
# Same counters as Stats (except distinctLogics) bucketed by UTC day.
type DailyStats {
  id: ID! # "YYYY-MM-DD" — sortable, deterministic
  dayTimestamp: BigInt! # Start-of-day Unix timestamp (midnight UTC)
  transactions: BigInt!
  tags: BigInt!
  tagsConsumed: BigInt!
  tagsCreated: BigInt!
  actions: BigInt!
  resources: BigInt!
  commitmentRoots: BigInt!
  externalCalls: BigInt!
  forwarderCalls: BigInt!
  resourcePayloads: BigInt!
  discoveryPayloads: BigInt!
  applicationPayloads: BigInt!
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
}

# ChainStats - Per-chain singleton (id: chainId as decimal string, e.g. "1", "8453")
# Same counter set as Stats; lets clients sum or exclude chains without scanning
# the underlying tables (Envio's hosted Hasura disables _aggregate root fields).
type ChainStats {
  id: ID!
  chainId: BigInt! @index
  transactions: BigInt!
  tags: BigInt!
  tagsConsumed: BigInt!
  tagsCreated: BigInt!
  actions: BigInt!
  resources: BigInt!
  commitmentRoots: BigInt!
  distinctLogics: BigInt!
  externalCalls: BigInt!
  forwarderCalls: BigInt!
  resourcePayloads: BigInt!
  discoveryPayloads: BigInt!
  applicationPayloads: BigInt!
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
}

# ChainDailyStats - Per-chain per-day (id: "<chainId>-YYYY-MM-DD")
# Same counter set as DailyStats. Bounded result set (chains × days) makes
# filtered time-series charts cheap.
type ChainDailyStats @index(fields: ["chainId", "dayTimestamp"]) {
  id: ID!
  chainId: BigInt! @index
  date: String! @index # "YYYY-MM-DD"
  dayTimestamp: BigInt! @index
  transactions: BigInt!
  tags: BigInt!
  tagsConsumed: BigInt!
  tagsCreated: BigInt!
  actions: BigInt!
  resources: BigInt!
  commitmentRoots: BigInt!
  externalCalls: BigInt!
  forwarderCalls: BigInt!
  resourcePayloads: BigInt!
  discoveryPayloads: BigInt!
  applicationPayloads: BigInt!
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
}

# ChainLogicRef - Per-chain first-seen tracker for logic references.
# id: "<chainId>-<logicRef>". Existence of a row means the logic has been
# seen on that chain; absence triggers a ChainStats.distinctLogics increment.
type ChainLogicRef {
  id: ID!
  chainId: BigInt! @index
  logicRef: String! @index
  firstSeenBlock: BigInt!
  firstSeenTimestamp: BigInt!
  firstSeenTxHash: String!
}
