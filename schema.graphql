# Anoma Protocol Adapter GraphQL Schema
# Entities follow Anoma specification from pa-evm/contracts/src/Types.sol

# ============================================
# Enums
# ============================================

# Blob deletion criterion from PA-EVM Logic.DeletionCriterion
enum DeletionCriterion {
  immediately  # Blob should be deleted after processing (value: 0)
  never        # Blob should be persisted permanently (value: 1)
}

# Payload category indicator
enum PayloadCategory {
  resource      # ResourcePayload - resource blob data
  discovery     # DiscoveryPayload - data with public keys for discovery
  externalCall  # ExternalPayload - data for external/forwarder calls
  application   # ApplicationPayload - application-specific data
}

# ============================================
# EVM Types
# ============================================

# EVMTransaction - The EVM transaction that carries Anoma transaction(s)
# This represents the blockchain carrier/wrapper, not the Anoma payload.
# One EVM transaction may carry multiple Anoma transactions (e.g., via multicall).
type EVMTransaction @index(fields: ["chainId", "blockNumber"]) @index(fields: ["chainId", "timestamp"]) {
  id: ID!  # Format: {chainId}_{txHash}
  txHash: String!
  blockNumber: Int! @index
  timestamp: Int! @index
  chainId: Int! @index

  # EVM transaction metadata
  from: String
  value: BigInt

  # Relationships
  transactions: [Transaction!]! @derivedFrom(field: "evmTransaction")
}

# ============================================
# Core Anoma Types
# ============================================

# Transaction - The Anoma transaction payload embedded in an EVM transaction
# Corresponds to: struct Transaction { Action[] actions; bytes deltaProof; bytes aggregationProof; }
type Transaction @index(fields: ["chainId", "blockNumber"]) @index(fields: ["chainId", "blockNumber", "logIndex"]) @index(fields: ["contractAddress", "chainId", "blockNumber", "logIndex"]) {
  id: ID!  # Format: {chainId}_{txHash}_{logIndex}
  logIndex: Int! @index # EVM event log index of the TransactionExecuted event
  contractAddress: String! @index

  # Denormalized from EVMTransaction for efficient sorting/filtering
  # (eliminates cross-table JOIN for ORDER BY blockNumber/timestamp)
  blockNumber: Int! @index
  timestamp: Int! @index
  chainId: Int! @index

  # From TransactionExecuted event
  tagHashes: [String!]!
  logicRefs: [String!]!

  # Proofs (from calldata decoding)
  deltaProof: String
  aggregationProof: String

  # Relationship to EVM carrier
  evmTransaction: EVMTransaction! @index

  # Relationships (note: tags is a convenience, canonical path is via actions/complianceUnits)
  actions: [Action!]! @derivedFrom(field: "transaction")
  tags: [Tag!]! @derivedFrom(field: "transaction")
}

# Action - Provides context separation between non-intersecting sets of resources
# Corresponds to: struct Action { Logic.VerifierInput[] logicVerifierInputs; Compliance.VerifierInput[] complianceVerifierInputs; }
type Action @index(fields: ["chainId", "blockNumber"]) {
  id: ID!
  index: Int!
  actionTreeRoot: String!
  actionTagCount: Int!
  blockNumber: Int! @index
  chainId: Int! @index
  timestamp: Int! @index

  # Stable EVM-tx correlation key ({chainId}_{txHash}); lets TransactionExecuted
  # locate this action without cross-event module state.
  evmTxId: String! @index

  # Relationships
  transaction: Transaction! @index
  complianceUnits: [ComplianceUnit!]! @derivedFrom(field: "action")
  logicInputs: [LogicInput!]! @derivedFrom(field: "action")
}

# ComplianceUnit - One consumed + one created resource pair
# Corresponds to: Compliance.VerifierInput { bytes proof; Instance instance; }
type ComplianceUnit @index(fields: ["chainId", "timestamp"]) {
  id: ID!
  index: Int!
  timestamp: Int! @index
  chainId: Int! @index

  # Proof
  proof: String

  # Compliance.Instance fields
  # ConsumedRefs
  consumedNullifier: String!
  consumedLogicRef: String!
  consumedCommitmentTreeRoot: String!

  # CreatedRefs
  createdCommitment: String!
  createdLogicRef: String!

  # Delta values (secp256k1 point)
  unitDeltaX: String!
  unitDeltaY: String!

  # Relationships
  action: Action! @index
  consumedTag: Tag
  createdTag: Tag
}

# LogicInput - Logic verifier input for a resource
# Corresponds to: Logic.VerifierInput { bytes32 tag; bytes32 verifyingKey; AppData appData; bytes proof; }
type LogicInput @index(fields: ["chainId", "timestamp"]) {
  id: ID!
  index: Int!
  timestamp: Int! @index
  chainId: Int! @index

  tagHash: String!
  verifyingKey: String! # The logic verifying key (verifyingKey in PA-EVM Logic.VerifierInput)
  isConsumed: Boolean!
  proof: String

  # AppData payload counts
  resourcePayloadCount: Int!
  discoveryPayloadCount: Int!
  externalPayloadCount: Int!
  applicationPayloadCount: Int!

  # Relationships
  action: Action! @index
  tag: Tag
}

# Tag - A reference to an Anoma resource identified by its tag hash (nullifier or commitment)
type Tag @index(fields: ["chainId", "blockNumber"]) @index(fields: ["chainId", "timestamp"]) {
  id: ID!
  tagHash: String! @index # Nullifier (if consumed) or commitment (if created)
  index: Int! # Position in TransactionExecuted.tags array
  isConsumed: Boolean! # true = nullifier (consumed), false = commitment (created)
  blockNumber: Int! @index
  timestamp: Int! @index
  chainId: Int! @index

  # Logic reference from TransactionExecuted.logicRefs
  logicRef: String

  # Relationships
  transaction: Transaction! @index
  logicInput: LogicInput
  complianceUnit: ComplianceUnit # The compliance unit this tag belongs to (use isConsumed to determine side)
  payloads: [Payload!]! @derivedFrom(field: "tag")
}

# ============================================
# Payload Types (from events)
# ============================================

# Unified Payload type for all payload events (Resource, Discovery, External, Application)
# Note: blockNumber, chainId, timestamp can be accessed via tag.transaction
type Payload {
  id: ID!
  category: PayloadCategory! @index # Discriminator for payload type
  tagHash: String!
  index: Int!
  blob: String!
  deletionCriterion: DeletionCriterion
  tag: Tag @index
}

# ============================================
# State Tracking Types
# ============================================

# CommitmentTreeRoot - Merkle tree root for resource commitments
type CommitmentTreeRoot @index(fields: ["blockNumber", "logIndex"]) @index(fields: ["chainId", "blockNumber", "logIndex"]) {
  id: ID!
  root: String!
  blockNumber: Int! @index
  logIndex: Int!  # EVM log index — tiebreaker for ordering within a block
  txHash: String!
  timestamp: Int! @index
  chainId: Int! @index
}

# ForwarderCall - Meta-transaction execution via untrusted forwarder
type ForwarderCall @index(fields: ["chainId", "blockNumber"]) {
  id: ID!
  untrustedForwarder: String!
  input: String!
  output: String!
  blockNumber: Int! @index
  txHash: String!
  timestamp: Int! @index
  chainId: Int! @index
}

# OwnershipTransferred - OZ Ownable ownership transfer event
type OwnershipTransferred {
  id: ID!
  previousOwner: String!
  newOwner: String!
  blockNumber: Int!
  txHash: String!
  timestamp: Int!
  chainId: Int!
}

# ProtocolAdapterPaused - OZ Pausable pause/unpause event
# A single entity covers both Paused and Unpaused events; paused=true means paused.
type ProtocolAdapterPaused {
  id: ID!
  account: String!
  paused: Boolean!
  blockNumber: Int!
  txHash: String!
  timestamp: Int!
  chainId: Int!
}

# ============================================
# Distinct Logic Tracking
# ============================================

# LogicRef - Tracks each distinct logic verifying key seen on-chain
# Used to compute the distinctLogics counter in Stats.
type LogicRef {
  id: ID!  # The logicRef hex value (bytes32)
  firstSeenBlock: Int!
  firstSeenTimestamp: Int!
  firstSeenChainId: Int!
  firstSeenTxHash: String!
}

# ============================================
# Aggregate Statistics
# ============================================

# Stats - Global statistics singleton (id: "global")
# Counters are incremented by event handlers for accurate totals.
type Stats {
  id: ID!  # Always "global" - singleton pattern
  transactions: Int!
  tags: Int!
  tagsConsumed: Int!
  tagsCreated: Int!
  actions: Int!
  complianceUnits: Int!
  logicInputs: Int!
  commitmentRoots: Int!
  distinctLogics: Int!
  externalCalls: Int!
  forwarderCalls: Int!
  resourcePayloads: Int!
  discoveryPayloads: Int!
  applicationPayloads: Int!
  lastUpdatedBlock: Int!
  lastUpdatedTimestamp: Int!
}

# DailyStats - Per-day statistics for time-series charts (id: "YYYY-MM-DD")
# Same counters as Stats (except distinctLogics) bucketed by UTC day.
type DailyStats {
  id: ID!               # "YYYY-MM-DD" — sortable, deterministic
  dayTimestamp: Int!     # Start-of-day Unix timestamp (midnight UTC)
  transactions: Int!
  tags: Int!
  tagsConsumed: Int!
  tagsCreated: Int!
  actions: Int!
  complianceUnits: Int!
  logicInputs: Int!
  commitmentRoots: Int!
  externalCalls: Int!
  forwarderCalls: Int!
  resourcePayloads: Int!
  discoveryPayloads: Int!
  applicationPayloads: Int!
  lastUpdatedBlock: Int!
  lastUpdatedTimestamp: Int!
}

# ChainStats - Per-chain singleton (id: chainId as decimal string, e.g. "1", "8453")
# Same counter set as Stats; lets clients sum or exclude chains without scanning
# the underlying tables (Envio's hosted Hasura disables _aggregate root fields).
type ChainStats {
  id: ID!
  chainId: Int! @index
  transactions: Int!
  tags: Int!
  tagsConsumed: Int!
  tagsCreated: Int!
  actions: Int!
  complianceUnits: Int!
  logicInputs: Int!
  commitmentRoots: Int!
  distinctLogics: Int!
  externalCalls: Int!
  forwarderCalls: Int!
  resourcePayloads: Int!
  discoveryPayloads: Int!
  applicationPayloads: Int!
  lastUpdatedBlock: Int!
  lastUpdatedTimestamp: Int!
}

# ChainDailyStats - Per-chain per-day (id: "<chainId>-YYYY-MM-DD")
# Same counter set as DailyStats. Bounded result set (chains × days) makes
# filtered time-series charts cheap.
type ChainDailyStats @index(fields: ["chainId", "dayTimestamp"]) {
  id: ID!
  chainId: Int! @index
  date: String! @index   # "YYYY-MM-DD"
  dayTimestamp: Int! @index
  transactions: Int!
  tags: Int!
  tagsConsumed: Int!
  tagsCreated: Int!
  actions: Int!
  complianceUnits: Int!
  logicInputs: Int!
  commitmentRoots: Int!
  externalCalls: Int!
  forwarderCalls: Int!
  resourcePayloads: Int!
  discoveryPayloads: Int!
  applicationPayloads: Int!
  lastUpdatedBlock: Int!
  lastUpdatedTimestamp: Int!
}

# ChainLogicRef - Per-chain first-seen tracker for verifyingKeys.
# id: "<chainId>-<verifyingKey>". Existence of a row means the key has been
# seen on that chain; absence triggers a ChainStats.distinctLogics increment.
type ChainLogicRef {
  id: ID!
  chainId: Int! @index
  verifyingKey: String! @index
  firstSeenBlock: Int!
  firstSeenTimestamp: Int!
  firstSeenTxHash: String!
}
