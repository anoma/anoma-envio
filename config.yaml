name: anoma-envio
save_full_history: false
contracts:
  - name: ProtocolAdapter
    handler: src/EventHandlers.ts
    events:
      - event: ActionExecuted(bytes32 actionTreeRoot, bytes32[] nullifiers, bytes32[] consumedLogicRefs, bytes32[] commitments, bytes32[] createdLogicRefs)
      - event: ApplicationPayload(bytes32 indexed tag, uint256 index, bytes blob)
      - event: CommitmentTreeRootAdded(bytes32 root)
      - event: DiscoveryPayload(bytes32 indexed tag, uint256 index, bytes blob)
      - event: ExternalPayload(bytes32 indexed tag, uint256 index, bytes blob)
      - event: ForwarderCallExecuted(address indexed untrustedForwarder, bytes input, bytes output)
      - event: KindTableCommitmentUpdated(bytes32 indexed kindTableCommitment)
      - event: OwnershipTransferred(address indexed previousOwner, address indexed newOwner)
      - event: Paused(address account)
      - event: ResourcePayload(bytes32 indexed tag, uint256 index, bytes blob)
      - event: TransactionExecuted(bytes32 indexed transactionId)
      - event: Unpaused(address account)
      - event: Upgraded(address indexed implementation)
field_selection:
  transaction_fields:
    - "hash"
    - "from"
    - "to"
    - "value"
    - "input"
# The events above are the pa-evm v2 shapes, taken from contracts/v2.0.0-alpha.5.
# Addresses are the ERC-1967 proxies, not the implementations: the proxy holds the state and
# emits the events. start_block is the proxy deployment block.
# v2 addresses: https://github.com/anoma/pa-evm/blob/contracts/v2.0.0-alpha.5/crates/bindings/deployments.json
chains:
  - id: 84532 # Base Sepolia
    start_block: 45161853
    contracts:
      - name: ProtocolAdapter
        address:
          # The deployment that has actually executed transactions to date.
          - "0xED41cB03feaFB2159182b385873BFa858C577e96"
          # The canonical contracts/v2.0.0-alpha.5 deployment; no executed transactions yet.
          - "0x6BbDF59F869957dDC96e8a4d79077613727e6537"
  - id: 11155111 # Sepolia
    start_block: 11480805
    contracts:
      - name: ProtocolAdapter
        address:
          # The canonical contracts/v2.0.0-alpha.5 deployment; no executed transactions yet.
          - "0xb7f6DE4Edc94b871B5dB57aa40BbBabC6E9F56fE"
